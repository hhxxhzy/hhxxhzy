<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="welcome banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="220" rx="12" fill="url(#bg)"/>

  <!-- grid dots -->
  <g fill="#3b4261" opacity="0.35">
    <circle cx="40" cy="30" r="1.5"/><circle cx="120" cy="30" r="1.5"/><circle cx="200" cy="30" r="1.5"/><circle cx="280" cy="30" r="1.5"/><circle cx="360" cy="30" r="1.5"/><circle cx="440" cy="30" r="1.5"/><circle cx="520" cy="30" r="1.5"/><circle cx="600" cy="30" r="1.5"/><circle cx="680" cy="30" r="1.5"/><circle cx="760" cy="30" r="1.5"/>
    <circle cx="40" cy="70" r="1.5"/><circle cx="120" cy="70" r="1.5"/><circle cx="200" cy="70" r="1.5"/><circle cx="280" cy="70" r="1.5"/><circle cx="360" cy="70" r="1.5"/><circle cx="440" cy="70" r="1.5"/><circle cx="520" cy="70" r="1.5"/><circle cx="600" cy="70" r="1.5"/><circle cx="680" cy="70" r="1.5"/><circle cx="760" cy="70" r="1.5"/>
    <circle cx="40" cy="110" r="1.5"/><circle cx="120" cy="110" r="1.5"/><circle cx="200" cy="110" r="1.5"/><circle cx="280" cy="110" r="1.5"/><circle cx="360" cy="110" r="1.5"/><circle cx="440" cy="110" r="1.5"/><circle cx="520" cy="110" r="1.5"/><circle cx="600" cy="110" r="1.5"/><circle cx="680" cy="110" r="1.5"/><circle cx="760" cy="110" r="1.5"/>
  </g>

  <!-- animated waves -->
  <path fill="url(#wave2)" opacity="0.6">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 150 C 200 100, 400 200, 800 130 L 800 220 L 0 220 Z;
              M0 130 C 200 200, 400 100, 800 150 L 800 220 L 0 220 Z;
              M0 150 C 200 100, 400 200, 800 130 L 800 220 L 0 220 Z"/>
  </path>
  <path fill="url(#wave1)" opacity="0.45">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 170 C 250 130, 500 220, 800 150 L 800 220 L 0 220 Z;
              M0 150 C 250 220, 500 130, 800 170 L 800 220 L 0 220 Z;
              M0 170 C 250 130, 500 220, 800 150 L 800 220 L 0 220 Z"/>
  </path>

  <!-- title -->
  <text x="400" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="url(#txt)">
    &lt; hhxxhzy /&gt;
  </text>
  <text x="400" y="125" text-anchor="middle" font-family="monospace" font-size="14" fill="#a9b1d6">
    const code = passion + persistence;
  </text>

  <!-- glow cursor line -->
  <rect x="250" y="140" width="300" height="3" rx="1.5" fill="url(#txt)" opacity="0.85">
    <animate attributeName="opacity" values="0.85;0.2;0.85" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
