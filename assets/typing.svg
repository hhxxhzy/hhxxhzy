<svg width="600" height="60" viewBox="0 0 600 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="typing animation">
  <style>
    .mono { font-family: 'Cascadia Code', Consolas, monospace; font-size: 22px; }
  </style>

  <rect width="600" height="60" rx="10" fill="#f6f8fa"/>
  <clipPath id="clip-light">
    <rect x="18" y="0" height="60" width="0">
      <animate attributeName="width" values="0;0;440;440;0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <g clip-path="url(#clip-light)">
    <text class="mono" x="18" y="38" fill="#24292f">&gt; building cool things...<tspan fill="#0969da">_</tspan></text>
  </g>
  <rect x="18" y="18" width="11" height="26" rx="2" fill="#0969da">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.05;0.06;0.94;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
